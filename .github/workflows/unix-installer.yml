name: Unix installer
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'launcher.py', 'requirements.txt', 'tools/verify_unix_install.py', '.github/workflows/unix-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, update and start as a student
        run: python tools/verify_unix_install.py
